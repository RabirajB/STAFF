### model
model_name_or_path: YOUR_DIR/models/Qwen2.5-32B-Instruct
adapter_name_or_path: YOUR_DIR/dialogsum_qwen32-factory-sft-select
quantization_bit: 8

### method
stage: sft
do_predict: true
finetuning_type: lora

### dataset
dataset: dialogsum
template: qwen
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 16
dataset_dir: YOUR_DIR/STAFF/finetune/data
# max_samples: 32
tokenized_path: YOUR_DIR/STAFF/finetune/data/dialogsum_dataset_test-qwen-32b

### output
output_dir: YOUR_DIR/dialogsum_qwen32-factory-sft/predict
overwrite_output_dir: true

### eval
val_size: 0.1
per_device_eval_batch_size: 4
predict_with_generate: true
ddp_timeout: 180000000